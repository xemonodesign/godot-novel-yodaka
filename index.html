<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>よだか — ことばの標本</title>
<meta name="description" content="誰かにもらった言葉を、わたしの中に。言葉を集めて自分の気持ちを振り返るノベルゲーム。">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171e1c;color:#fafbf5;font-family:system-ui,sans-serif}#canvas{display:block;width:100%;height:100%;outline:none;touch-action:manipulation}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#171e1c;gap:20px}h1{font-size:48px;font-weight:400;letter-spacing:.2em;margin:0}p{color:#b5c3ad;font-size:14px;line-height:1.8;text-align:center;padding:0 24px}progress{width:260px;height:5px;accent-color:#c7e5ba}#error{max-width:600px;white-space:pre-wrap}button{background:#c7e5ba;padding:12px 24px;border:0;border-radius:3px;font-size:16px;cursor:pointer}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<canvas id="canvas" tabindex="0">WebGL 2.0に対応したブラウザで開いてください。</canvas>
<div id="loading"><p>誰かにもらった言葉を、わたしの中に。</p><h1>よだか</h1><p>ことばの標本</p><progress id="progress"></progress><p id="message">物語を準備しています。初回は少し時間がかかります。</p><p id="error"></p></div>
<script src="index.js"></script>
<script>
const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9871976,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
const progress = document.getElementById('progress');
engine.startGame({canvas:document.getElementById('canvas'),onProgress:(loaded,total)=>{if(total>0){progress.max=total;progress.value=loaded;}}}).then(()=>{document.getElementById('loading').remove();document.getElementById('canvas').focus();}).catch(error=>{progress.remove();document.getElementById('message').textContent='読み込みに失敗しました。ページを再読み込みしてください。';document.getElementById('error').textContent=String(error);});
</script>
</body>
</html>
